services:
  type: web
  name: vypax-api
  runtime: node
  buildCommand: npm install
  startCommand: node server/index.js
  envVars:
    - key: NODE_ENV
      value: production
    - key: PORT
      value: 5000
    - key: CLIENT_ORIGIN
      sync: false
    - key: MONGODB_URI
      sync: false
    - key: EMAIL_SERVICE
      sync: false
    - key: EMAIL_USER
      sync: false
    - key: EMAIL_PASS
      sync: false
    - key: NOTIFICATION_EMAIL
      sync: false
    - key: VITE_API_URL
      sync: false
